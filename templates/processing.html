<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processing - ExplainIT AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #E8D5F2 0%, #DCD1E8 50%, #C9B8E0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .spinner-border {
      width: 3rem;
      height: 3rem;
      color: #667eea;
    }

    .progress {
      height: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .progress-bar {
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.5s ease;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2 class="mb-4">Processing Video</h2>
    <div class="spinner-border mb-3" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="lead text-muted" id="statusText">Initializing...</p>

    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"
        id="progressBar"></div>
    </div>
    <p class="mt-3 small text-muted">This may take a few minutes for large videos. Please do not close this tab.</p>
  </div>

  <script>
    const jobId = "{{ job_id }}";

    function checkStatus() {
      fetch(`/status/${jobId}`)
        .then(response => response.json())
        .then(data => {
          document.getElementById('statusText').innerText = data.status;

          // Update progress bar based on status (approximate)
          let progress = 10;
          if (data.status.includes("Processing chunk")) {
            progress = 40;
          } else if (data.status.includes("Summarizing")) {
            progress = 70;
          } else if (data.status.includes("Generating Audio")) {
            progress = 90;
          } else if (data.status === "completed") {
            progress = 100;
          } else if (data.status === "failed") {
            document.getElementById('statusText').innerText = "Processing Failed: " + (data.error || "Unknown error");
            document.querySelector('.spinner-border').classList.remove('spinner-border'); // Stop spinner
            document.querySelector('.spinner-border').innerHTML = '<i class="fas fa-times-circle text-danger" style="font-size: 3rem;"></i>';
            return;
          } else if (data.status === "unknown") {
            // Job lost (likely server restart due to OOM)
            document.getElementById('statusText').innerText = "Job Lost! (Server likely restarted/crashed). Please try a smaller file.";
            document.querySelector('.spinner-border').classList.remove('spinner-border');
            document.querySelector('.spinner-border').innerHTML = '<i class="fas fa-exclamation-triangle text-warning" style="font-size: 3rem;"></i>';
            return;
          }

          document.getElementById('progressBar').style.width = progress + "%";

          if (data.status === "completed") {
            window.location.href = `/history/${data.result_id}`;
          } else {
            setTimeout(checkStatus, 2000); // Poll every 2 seconds
          }
        })
        .catch(err => {
          console.error("Error polling status:", err);
          setTimeout(checkStatus, 5000);
        });
    }

    // Start polling
    checkStatus();
  </script>
</body>

</html>
